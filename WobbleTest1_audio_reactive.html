    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        #lottie-wrapper {
            position: absolute;
            left: -50vw;
            top: -5vh;
            width: 200vw;
            height: 200vh;
            opacity: 0.8;
            transform-origin: center center;
            transition: transform 0.08s ease-out;
            will-change: transform;
        }
        #lottie {
            width: 100%;
            height: 100%;
        }
        .blur-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            z-index: 10;
            pointer-events: none;
        }
        #start-btn {
            position: absolute;
            z-index: 100;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 18px 38px;
            font-size: 18px;
            font-weight: 600;
            color: #333;
            background: rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.15);
            border-radius: 14px;
            cursor: pointer;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background 0.2s, transform 0.15s;
            letter-spacing: 0.02em;
        }
        #start-btn:hover {
            background: rgba(0,0,0,0.1);
            transform: translate(-50%, -50%) scale(1.04);
        }
        #start-btn.hidden { display: none; }
        #level-bar {
            position: absolute;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }
        #level-bar.visible { opacity: 1; }
        #level-bar .label {
            color: rgba(0,0,0,0.4);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        #level-track {
            width: 180px;
            height: 4px;
            background: rgba(0,0,0,0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        #level-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #a733c7, #d902a0, #2779f8);
            border-radius: 2px;
            transition: width 0.08s ease-out;
        }
        #scale-val {
            color: rgba(0,0,0,0.4);
            font-size: 12px;
            font-variant-numeric: tabular-nums;
            min-width: 42px;
        }
    </style>

        var anim = lottie.loadAnimation({
            container: document.getElementById('lottie'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            animationData: animationData
        });

        // Audio reactive scaling
        const MIN_SCALE = 1.0;
        const MAX_SCALE = 2.0;
        const SMOOTHING = 0.12; // lower = snappier, higher = smoother

        const wrapper = document.getElementById('lottie-wrapper');
        const btn = document.getElementById('start-btn');
        const levelBar = document.getElementById('level-bar');
        const levelFill = document.getElementById('level-fill');
        const scaleVal = document.getElementById('scale-val');

        let currentScale = MIN_SCALE;
        let targetScale = MIN_SCALE;
        let audioCtx, analyser, dataArray, source;

        btn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 512;
                analyser.smoothingTimeConstant = 0.3;
                source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                btn.classList.add('hidden');
                levelBar.classList.add('visible');
                tick();
            } catch (e) {
                btn.textContent = 'Mikrofon nicht verfügbar';
                btn.style.borderColor = 'rgba(255,80,80,0.5)';
                console.error(e);
            }
        });

        function getVolume() {
            analyser.getByteFrequencyData(dataArray);
            // Focus on lower frequency bins (carry most energy)
            var bins = Math.floor(dataArray.length * 0.6);
            let sum = 0;
            for (let i = 0; i < bins; i++) {
                sum += dataArray[i];
            }
            var raw = sum / bins / 255;
            // Amplify signal ~5x for better sensitivity
            return Math.min(1, raw * 5);
        }

        function tick() {
            const vol = getVolume();
            targetScale = MIN_SCALE + vol * (MAX_SCALE - MIN_SCALE);
            // Smooth interpolation — fast attack, slower release
            const speed = targetScale > currentScale ? 0.35 : SMOOTHING;
            currentScale += (targetScale - currentScale) * speed;
            // Clamp
            currentScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, currentScale));

            wrapper.style.transform = `scale(${currentScale})`;
            levelFill.style.width = `${((currentScale - MIN_SCALE) / (MAX_SCALE - MIN_SCALE)) * 100}%`;
            scaleVal.textContent = currentScale.toFixed(2) + '×';

            requestAnimationFrame(tick);
        }
    </script>
